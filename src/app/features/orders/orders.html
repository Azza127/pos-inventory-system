<div class="page-header">
    <div>
      <h1>Orders</h1>
      <p>Manage customer orders and track fulfillment.</p>
    </div>
  </div>
  
  @if (loadError) {
    <div class="load-error">
      Couldn't load orders. Please check that the API server is running and try again.
    </div>
  }
  
  <div class="status-section">
    <app-order-status-tabs [orders]="orders" [activeStatus]="activeStatus" (statusChange)="onStatusChange($event)"></app-order-status-tabs>
  </div>

  <div class="panel orders-panel orders-card">
    <app-order-filters [searchTerm]="searchTerm" [dateFilter]="dateFilter" (searchTermChange)="onSearchChange($event)" 
      (dateFilterChange)="onDateChange($event)"(exportClick)="exportCsv()"></app-order-filters>
    <app-order-table [orders]="filteredOrders" [loading]="loading" (orderSelect)="selectOrder($event)"></app-order-table>
  </div>
  
  <app-order-details-drawer [order]="selectedOrder" [products]="products" (closed)="closeDrawer()" (orderUpdated)="onOrderUpdated($event)" ></app-order-details-drawer>
